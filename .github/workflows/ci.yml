name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so new Go vulnerabilities are caught without a push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check for known vulnerabilities in Go and its standard library
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run the action against the example (expects blockers)
        id: scan
        uses: ./
        continue-on-error: true
        with:
          current: "1.24"
          target: "1.33"
          paths: testdata
      - name: The example must fail the gate
        run: test "${{ steps.scan.outcome }}" = "failure"
